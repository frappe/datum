name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor `pyproject.toml` promises, and what the box runs.
        # 3.11 is the floor because `datetime.UTC` does not exist before it.
        python: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --python ${{ matrix.python }}

      - name: Lint
        run: uv run --python ${{ matrix.python }} ruff check .

      - name: Format
        run: uv run --python ${{ matrix.python }} ruff format --check .

      - name: Install Vector
        run: |
          mkdir -p "$RUNNER_TEMP/vector"
          curl --fail --location --retry 3 https://install.datadoghq.com/vector/0.59.0/vector-0.59.0-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/vector.tar.gz"
          tar -xzf "$RUNNER_TEMP/vector.tar.gz" -C "$RUNNER_TEMP/vector"
          echo "$RUNNER_TEMP/vector/vector-x86_64-unknown-linux-musl/bin" >> "$GITHUB_PATH"

      - name: Verify Vector
        run: vector --version

      - name: Test
        env:
          VECTOR_REQUIRE_TESTS: "1"
        run: uv run --python ${{ matrix.python }} pytest -q
