[project]
name = "datum"
version = "0.1.0"
description = "Telemetry service over ClickHouse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
exporter = ["pyyaml>=6.0.2"]

[dependency-groups]
api = [
    "clickhouse-connect>=0.8",
    "cramjam>=2.8",
    "fastapi>=0.115",
    # [crypto] pulls cryptography, which PyJWT needs for the RSA and ECDSA
    # algorithms. HMAC is never accepted.
    "protobuf>=5",
    "pyjwt[crypto]>=2.9",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8",
    "pyyaml>=6.0.2",
    "ruff>=0.6",
    {include-group = "api"},
    "httpx>=0.27",
]

[project.scripts]
datum-exporter = "datum_exporter.cli:main"
datum-migrate = "datum.migrations.migrations:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datum", "datum_client", "datum_exporter"]

[tool.ruff]
line-length = 100
# Generated by protoc. Regenerate it, do not lint it:
#   uv run --with grpcio-tools python -m grpc_tools.protoc \
#     -Idatum/api/internals/remote --python_out=datum/api/internals/remote \
#     datum/api/internals/remote/remote_write.proto
extend-exclude = ["*_pb2.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
