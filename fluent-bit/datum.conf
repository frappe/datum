[FILTER]
    Name    lua
    Match   datum.*
    Script  datum.lua
    Call    datum_line

[OUTPUT]
    Name              http
    Match             datum.*
    Host              ${DATUM_HOST}
    Port              ${DATUM_PORT}
    tls               ${DATUM_TLS}
    tls.verify        On
    URI               /v1/logs/ingest
    Format            json
    Json_Date_Key     ts
    Json_Date_Format  iso8601
    Header            Authorization Bearer ${DATUM_TOKEN}
    Retry_Limit       no_limits
